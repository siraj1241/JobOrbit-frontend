# ─────────────────────────────────────────────────────────────────────
#  JobOrbit Frontend — nginx config
#  - SPA history fallback (all routes serve index.html)
#  - Gzip compression for HTML / CSS / JS / JSON
#  - Long-cache for hashed Vite assets (filename includes content hash)
# ─────────────────────────────────────────────────────────────────────

server {
    listen       80;
    listen  [::]:80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # ─── Gzip ────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/xml
        application/xml+rss
        application/atom+xml
        image/svg+xml;

    # ─── Static assets (Vite outputs with content hash) ─────────
    # Cache for 1 year — file changes produce a new filename.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # ─── SPA fallback ────────────────────────────────────────────
    # Any unknown route serves index.html so React Router can take over.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ─── Security headers ────────────────────────────────────────
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ─── Health probe for Render ─────────────────────────────────
    location = /health {
        access_log off;
        return 200 "ok";
        add_header Content-Type text/plain;
    }
}
