# ─────────────────────────────────────────────────────────────────────
#  Render Blueprint — JobOrbit Frontend (Vite + nginx)
#
#  Usage:
#    1. Push this repo to GitHub.
#    2. In Render Dashboard → New → Blueprint → pick this file.
#    3. VITE_API_URL is pre-set to the deployed backend URL.
#
#  This deploys a Dockerized nginx static-site that serves the Vite-built
#  bundle with runtime env-var injection for VITE_API_URL.
# ─────────────────────────────────────────────────────────────────────

services:
  - type: web
    name: joborbit-web
    env: docker
    region: oregon
    plan: free
    dockerfilePath: ./Dockerfile
    autoDeploy: true
    envVars:
      - key: VITE_API_URL
        value: https://joborbit-backend-5.onrender.com/api
